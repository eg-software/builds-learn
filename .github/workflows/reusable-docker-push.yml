name: Reusable Docker Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full image name, e.g. ghcr.io/org/repo"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      push_latest_on_main:
        description: "Push latest tag for main branch"
        required: false
        type: boolean
        default: true

jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Resolve image name
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            IMAGE_NAME="${{ inputs.image_name }}"
          else
            IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ steps.image.outputs.name }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker build -f "${{ inputs.dockerfile }}" -t "${IMAGE_NAME}:${SHA_TAG}" "${{ inputs.context }}"
          docker push "${IMAGE_NAME}:${SHA_TAG}"
          if [ "${{ inputs.push_latest_on_main }}" = "true" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag "${IMAGE_NAME}:${SHA_TAG}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi
